name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow superinference/ui to dispatch this (free, public) CI on the pinned core
  # sha instead of re-running core tests on billed private minutes.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        working-directory: ./core
        run: npm ci

      - name: CVE scan
        working-directory: ./core
        run: npm audit --omit=dev --audit-level=high

      - name: Security lint
        working-directory: ./core
        run: npx eslint src/ --ext .ts --max-warnings 0

      - name: Type check
        working-directory: ./core
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: ./core
        run: npm test

      # Accurate 99% coverage gate, measured via the native-ESM harness (NOT tsx,
      # whose CJS-interop helpers inflate branch counts below a real 99%). This gate
      # used to live only in the private superinference/ui CI; running it here keeps
      # core fully validated on every push in this FREE public repo.
      - name: Coverage gate (native-ESM, 99/99/99)
        working-directory: ./core
        run: node scripts/coverage-esm.mjs core --lines 99 --branches 99 --functions 99
